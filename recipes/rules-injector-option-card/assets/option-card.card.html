<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta

    <title>选项卡片</title>
    <style>
      :root {
        --bg: #f5efe4;
        --bg-card: #fbf7ee;
        --text: #2a2622;
        --text-light: #4a433c;
        --text-muted: #6b6158;
        --border: #d8cfbe;
        --accent: #537d96;
        --accent-hover: #3f6179;
        --accent-light: rgba(83, 125, 150, 0.08);
        --accent-rgb: 83, 125, 150;
        --font-serif:
          "EB Garamond", "Noto Serif SC", "Source Han Serif SC", "Songti SC",
          "STSong", serif;
        --font-ui: system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      /* Reset */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        background: var(--bg-card, #fbf7ee);
        color: var(--text, #2a2622);
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      /* The card gets the whole canvas: this rule sets the house's voice and claims
   no space. A margin here would be the host deciding how much of the card the
   card may use, which it cannot know — a sheet of paper wants writing held off
   the rim, a painted card wants the rim itself, and the two are told apart only
   from inside. Whichever it is, the card says so on its own content. */
      body {
        font-family: var(--font-serif);
        font-size: 14px;
        line-height: 1.65;
      }

      /* Typography (§4) */
      h1 {
        font-size: 1.35rem;
        font-weight: 500;
        line-height: 1.25;
        margin: 0 0 0.6em;
      }
      h2 {
        font-size: 1.1rem;
        font-weight: 500;
        line-height: 1.3;
        margin: 0.8em 0 0.4em;
        border-left: 2px solid var(--accent, #537d96);
        padding-left: 8px;
      }
      h3 {
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.35;
        margin: 0.6em 0 0.3em;
      }
      p {
        margin: 0.4em 0;
      }
      small {
        font-size: 0.75rem;
        color: var(--text-muted, #6b6158);
      }
      strong {
        font-weight: 500;
        color: var(--accent, #537d96);
      }
      a {
        color: var(--accent, #537d96);
        text-decoration: none;
      }
      hr {
        border: none;
        border-top: 0.5px solid var(--border, #d8cfbe);
        margin: 0.8em 0;
      }

      /* Table (§6) */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin: 0.6em 0;
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--text-light, #4a433c);
        padding: 6px 8px;
        border-bottom: 1px solid var(--border, #d8cfbe);
      }
      td {
        padding: 5px 8px;
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.06);
        color: var(--text, #2a2622);
      }
      tr:last-child td {
        border-bottom: none;
      }

      /* Lists */
      ul,
      ol {
        padding-left: 18px;
        margin: 0.4em 0;
      }
      li {
        margin: 0.15em 0;
      }
      li::marker {
        color: var(--accent, #537d96);
      }

      /* Code (§6) */
      pre {
        background: var(--bg, #f5efe4);
        border: 0.5px solid var(--border, #d8cfbe);
        border-radius: 4px;
        padding: 8px 12px;
        overflow-x: auto;
      }
      code {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--text, #2a2622);
      }

      /* Blockquote (§6) */
      blockquote {
        border-left: 2px solid var(--accent, #537d96);
        padding: 4px 0 4px 12px;
        color: var(--text-muted, #6b6158);
        font-style: italic;
        margin: 0.5em 0;
      }

      /* SVG defaults (§11) */
      svg {
        display: block;
        width: 100%;
        max-width: 100%;
      }
      svg text {
        font-family: var(--font-serif);
      }

      /* Accessibility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      /* Host-driven visible UI actions */
      [data-hana-ui-action-pressed="true"] {
        outline: 1px solid var(--accent, #537d96);
        outline-offset: -1px;
        filter: brightness(0.96);
      }
    </style>
    <script type="application/json" data-card-export>
      { "cardId": "rules-injector-option-card-template", "title": "选项卡片" }
    </script>
    <script type="application/json" data-card-state>
      { "cardId": "", "question": "示例问题", "options": ["选项一", "选项二"] }
    </script>
    <script data-hana-host-script="card-action-bridge">
      (function () {
        var MSG = "hana.card-keyboard-active";
        var SIZING_MSG = "card:sizing-mode";
        var SIZING_REQUEST_MSG = "card:sizing-mode-request";
        var ACTION_MSG = "hana.card-action";
        var ACTION_RESULT_MSG = "hana.card-action-result";
        // 宿主在把这张卡拓成一份新实例之前，先问它"你到目前为止试图存下来的东西是什么"。
        // 问答与 hana.card-action 同款：宿主发请求带 requestId，卡片照原样答回去。
        var STATE_SNAPSHOT_REQUEST_MSG = "hana.card-state-snapshot-request";
        var STATE_SNAPSHOT_MSG = "hana.card-state-snapshot";
        var CARD_REQUEST_MSG = "card:request";
        var CARD_RESPONSE_MSG = "card:response";
        // 本版之前铸出的宿主只认识、也只回这个旧名。新卡发中立名，但收响应时两种都认，
        // 这样一张卡在新旧宿主里都能拿到应答。
        var LEGACY_HOST_RESPONSE_MSG = "hana.card-host-response";
        var ACTION_ID_ATTR = "data-hana-ui-action-id";
        var DOM_SCAN_LIMIT = 600;
        var DOM_OUTLINE_LIMIT = 120;
        var ACTION_NODE_LIMIT = 80;
        var ACTION_PRESS_MS = 140;
        var HOST_REQUEST_TIMEOUT_MS = 5000;
        // A protected invocation can legitimately spend most of five minutes waiting
        // for its owner to answer a confirmation, then still needs time to execute.
        // Keep ordinary host questions short; only tool.invoke owns this long wait.
        var HOST_TOOL_REQUEST_TIMEOUT_MS = 6 * 60 * 1000 + 10000;
        var STANDALONE_STATE_MAX_BYTES = 64 * 1024;
        var DEFAULT_SEQUENCE_INTERVAL_MS = 260;
        var MIN_SEQUENCE_INTERVAL_MS = 40;
        var MAX_SEQUENCE_INTERVAL_MS = 5000;
        var MAX_SEQUENCE_STEPS = 256;
        var MIN_SEQUENCE_HOLD_MS = 40;
        var MAX_SEQUENCE_HOLD_MS = 10000;
        var MAX_SEQUENCE_TOTAL_MS = 120000;
        var MAX_SEQUENCE_CHORD_SIZE = 8;
        var INTERACTIVE_ROLES = {
          button: true,
          checkbox: true,
          link: true,
          menuitem: true,
          option: true,
          radio: true,
          slider: true,
          switch: true,
          tab: true,
          textbox: true,
        };
        var DATA_ACTION_HINTS = {
          action: true,
          key: true,
          midi: true,
          note: true,
          noteIdx: true,
          noteIndex: true,
          noteidx: true,
          noteindex: true,
          value: true,
        };
        var elementSeq = 0;
        // ── 音频解锁（iOS）──
        // iOS 只在可信用户手势的调用栈内允许 AudioContext.resume()；Agent 的
        // 合成点击 isTrusted=false，解锁不了。宿主包一层构造记录全部实例，
        // 用户第一次真实触摸卡片时统一 resume，之后合成序列照常出声。
        var hanaAudioContexts = [];
        (function hookAudioContexts() {
          ["AudioContext", "webkitAudioContext"].forEach(function (name) {
            var Orig = window[name];
            if (typeof Orig !== "function") return;
            var Wrapped = function AudioContextWithHanaUnlock(options) {
              var inst = arguments.length ? new Orig(options) : new Orig();
              hanaAudioContexts.push(inst);
              return inst;
            };
            Wrapped.prototype = Orig.prototype;
            window[name] = Wrapped;
          });
        })();
        function unlockAudioContexts(event) {
          if (event && event.isTrusted !== true) return;
          for (var i = 0; i < hanaAudioContexts.length; i += 1) {
            var ctx = hanaAudioContexts[i];
            try {
              if (ctx.state === "suspended") ctx.resume().catch(function () {});
            } catch (_) {
              /* resume 失败不影响触摸本身 */
            }
          }
        }
        window.addEventListener("pointerdown", unlockAudioContexts, true);
        window.addEventListener("touchend", unlockAudioContexts, true);
        window.addEventListener("keydown", unlockAudioContexts, true);
        function currentAudioContextState() {
          if (!hanaAudioContexts.length) return null;
          for (var i = 0; i < hanaAudioContexts.length; i += 1) {
            if (hanaAudioContexts[i].state === "suspended") return "suspended";
          }
          return "running";
        }
        var keyboardActive = false;
        function hostRequestId() {
          return (
            "cardhost_" +
            Date.now().toString(36) +
            "_" +
            Math.random().toString(36).slice(2, 8)
          );
        }
        // 失败信封的 result 恒为对象（规范要求），卡片代码读它时不必先判空，也不必
        // 为"宿主答的失败"和"卡片自己兜底答的失败"各写一条分支。
        function hostStructuredError(code, error, result) {
          return {
            ok: false,
            code: code,
            error: error,
            result: result || {},
          };
        }
        function safeJsonSize(value) {
          try {
            var text = JSON.stringify(value);
            return typeof text === "string" ? text.length : Infinity;
          } catch (_) {
            return Infinity;
          }
        }
        function standaloneExportCardId() {
          var node = document.querySelector(
            'script[type="application/json"][data-card-export]',
          );
          if (!node) return null;
          try {
            var parsed = JSON.parse(node.textContent || "");
            return parsed && typeof parsed.cardId === "string" && parsed.cardId
              ? parsed.cardId
              : null;
          } catch (_) {
            return null;
          }
        }
        function standaloneStorageKey() {
          // 优先用导出块里的 cardId 派生 key（同标题的两张卡不再互相覆盖对方的
          // localStorage）；没有该块（手写旧卡）时保留原 title/path 兜底。
          var cardId = standaloneExportCardId();
          var name =
            cardId || document.title || location.pathname || "interactive-card";
          return "hana:interactive-card-state:" + encodeURIComponent(name);
        }
        function standaloneEmbeddedStateSnapshot() {
          var node = document.querySelector(
            'script[type="application/json"][data-card-state]',
          );
          if (!node) return null;
          try {
            var parsed = JSON.parse(node.textContent || "");
            return parsed &&
              typeof parsed === "object" &&
              !Array.isArray(parsed)
              ? parsed
              : null;
          } catch (_) {
            return null;
          }
        }
        function standaloneReadState() {
          try {
            var raw = window.localStorage
              ? window.localStorage.getItem(standaloneStorageKey())
              : null;
            if (!raw) {
              // localStorage 还没有本地改动时，回退读导出时带的状态快照作初始值；
              // 一旦本地写过（哪怕写的是 {}），localStorage 优先。
              return standaloneEmbeddedStateSnapshot() || {};
            }
            var parsed = JSON.parse(raw);
            return parsed &&
              typeof parsed === "object" &&
              !Array.isArray(parsed)
              ? parsed
              : {};
          } catch (_) {
            return {};
          }
        }
        function standaloneWriteState(state) {
          if (!state || typeof state !== "object" || Array.isArray(state))
            state = {};
          if (safeJsonSize(state) > STANDALONE_STATE_MAX_BYTES) {
            return hostStructuredError(
              "CARD_HOST_STATE_TOO_LARGE",
              "Standalone Interactive Card state is too large.",
            );
          }
          try {
            if (!window.localStorage) {
              return hostStructuredError(
                "CARD_HOST_STORAGE_UNAVAILABLE",
                "Standalone storage is unavailable.",
              );
            }
            window.localStorage.setItem(
              standaloneStorageKey(),
              JSON.stringify(state),
            );
            return {
              ok: true,
              result: { storage: "localStorage", state: state },
            };
          } catch (err) {
            return hostStructuredError(
              "CARD_HOST_STORAGE_FAILED",
              err && err.message
                ? err.message
                : "Standalone storage write failed.",
            );
          }
        }
        // 中立能力名 → 本宿主一直在用的分发名。收到哪个名字都照办，卡片作者写
        // 中立名也能通。发射侧（card.invoke / card.capabilities）继续发老名字：
        // 两边都双收，互通已经成立，等中立发射串定下来再一次性换，免得现在换了
        // 之后又要为"老宿主收不到新名"再补一层兼容。
        var CAPABILITY_ALIASES = {
          invoke: "tool.invoke",
          capabilities: "host.capabilities",
        };
        function canonicalCapability(capability) {
          return Object.prototype.hasOwnProperty.call(
            CAPABILITY_ALIASES,
            capability,
          )
            ? CAPABILITY_ALIASES[capability]
            : capability;
        }
        function standaloneHostRequest(rawCapability, payload) {
          var capability = canonicalCapability(rawCapability);
          var data =
            payload && typeof payload === "object" && !Array.isArray(payload)
              ? payload
              : {};
          if (capability === "host.capabilities") {
            return Promise.resolve({
              ok: true,
              result: {
                environment: "standalone",
                pinned: false,
                capabilities: {
                  // 两个纯字符串状态字是可移植卡片读的那份；下面按能力名展开的
                  // 详情映射是本宿主的扩展，卡片不认识就忽略。
                  state: "local_fallback",
                  invoke: "requires_host",
                  "host.capabilities": { status: "available" },
                  "state.get": { status: "local_fallback" },
                  "state.set": { status: "local_fallback" },
                  "tool.invoke": { status: "requires_host" },
                },
                agentHint:
                  "This card is running outside Hana Host. Display works; host tool bindings need Hana.",
              },
            });
          }
          if (capability === "state.get") {
            var state = standaloneReadState();
            var key =
              typeof data.key === "string" && data.key.trim()
                ? data.key.trim()
                : null;
            return Promise.resolve({
              ok: true,
              result: Object.assign(
                { storage: "localStorage", state: state },
                key
                  ? {
                      key: key,
                      value: Object.prototype.hasOwnProperty.call(state, key)
                        ? state[key]
                        : null,
                    }
                  : {},
              ),
            });
          }
          if (capability === "state.set") {
            if (
              data.state &&
              typeof data.state === "object" &&
              !Array.isArray(data.state)
            ) {
              return Promise.resolve(standaloneWriteState(data.state));
            }
            var setKey =
              typeof data.key === "string" && data.key.trim()
                ? data.key.trim()
                : null;
            if (!setKey)
              return Promise.resolve(
                hostStructuredError(
                  "CARD_HOST_STATE_KEY_REQUIRED",
                  "state.set requires either state or key.",
                ),
              );
            var next = standaloneReadState();
            if (data.delete === true) delete next[setKey];
            else
              next[setKey] = Object.prototype.hasOwnProperty.call(data, "value")
                ? data.value
                : null;
            return Promise.resolve(standaloneWriteState(next));
          }
          if (capability === "run.status" || capability === "run.cancel") {
            return Promise.resolve(
              hostStructuredError(
                "CARD_HOST_CARD_NOT_PINNED",
                "run.status/run.cancel need the pinned Hana host. Pin this card to the Chalkboard first.",
              ),
            );
          }
          if (capability === "tool.invoke") {
            return Promise.resolve(
              hostStructuredError(
                "CARD_HOST_TOOL_UNAVAILABLE",
                "This Interactive Card tool binding requires Hana Host.",
                { bindingId: data.bindingId || null },
              ),
            );
          }
          return Promise.resolve(
            hostStructuredError(
              "CARD_HOST_CAPABILITY_NOT_SUPPORTED",
              "Unsupported card host capability.",
            ),
          );
        }
        function requestHostCapability(capability, payload) {
          if (typeof capability !== "string" || !capability.trim()) {
            return Promise.resolve(
              hostStructuredError(
                "CARD_HOST_CAPABILITY_REQUIRED",
                "Card host capability is required.",
              ),
            );
          }
          capability = capability.trim();
          if (!window.parent || window.parent === window) {
            return standaloneHostRequest(capability, payload);
          }
          return new Promise(function (resolve) {
            var requestId = hostRequestId();
            var finished = false;
            function finish(value) {
              if (finished) return;
              finished = true;
              window.removeEventListener("message", onMessage);
              clearTimeout(timer);
              resolve(
                value && typeof value === "object"
                  ? value
                  : hostStructuredError(
                      "CARD_HOST_INVALID_RESPONSE",
                      "Card host returned an invalid response.",
                    ),
              );
            }
            function onMessage(event) {
              var data = event.data;
              if (!data || data.requestId !== requestId) return;
              if (
                data.type !== CARD_RESPONSE_MSG &&
                data.type !== LEGACY_HOST_RESPONSE_MSG
              )
                return;
              finish({
                ok: data.ok === true,
                code: data.code || undefined,
                error: data.error || undefined,
                result:
                  data.result && typeof data.result === "object"
                    ? data.result
                    : undefined,
              });
            }
            var timeoutMs =
              canonicalCapability(capability) === "tool.invoke"
                ? HOST_TOOL_REQUEST_TIMEOUT_MS
                : HOST_REQUEST_TIMEOUT_MS;
            var timer = setTimeout(function () {
              finish(
                hostStructuredError(
                  "CARD_HOST_TIMEOUT",
                  "Hana Host did not answer the Interactive Card request in time.",
                ),
              );
            }, timeoutMs);
            window.addEventListener("message", onMessage);
            try {
              window.parent.postMessage(
                {
                  type: CARD_REQUEST_MSG,
                  requestId: requestId,
                  capability: capability,
                  payload: payload === undefined ? null : payload,
                },
                "*",
              );
            } catch (err) {
              finish(
                hostStructuredError(
                  "CARD_HOST_POST_FAILED",
                  err && err.message
                    ? err.message
                    : "Failed to send Interactive Card request to Hana Host.",
                ),
              );
            }
          });
        }
        // ── 本地乐观状态层 ──
        // 卡片每一次 state.set 都先落在这里，然后照旧转发给宿主。聊天卡的 state.set
        // 由宿主本地确认、不落宿主存储（inline parity 波，owner 2026-08-20）——
        // 这一层因此不是兜底，是聊天卡状态的正式存放处：用户刚打的字、刚勾的框就
        // 活在这里。宿主要把卡拓上黑板时来问这一层，用户在聊天里做过的事就一起被
        // 拓走，而不是被出厂状态盖掉。
        // 读取一个字都不碰：state.get 仍然只问宿主，聊天读消息块的只读种子、钉住读
        // 实例态的分工不变。
        var localState = {};
        function rememberLocalState(key, value) {
          // 没给值等同写空，与独立运行时的存储规则同款；JSON 里没有 undefined 这种东西。
          localState[key] = value === undefined ? null : value;
        }
        function rememberLocalStatePatch(patch) {
          for (var key in patch) {
            if (Object.prototype.hasOwnProperty.call(patch, key))
              rememberLocalState(key, patch[key]);
          }
        }
        function postStateSnapshot(requestId) {
          var snapshot = {};
          for (var key in localState) {
            if (Object.prototype.hasOwnProperty.call(localState, key))
              snapshot[key] = localState[key];
          }
          // 只答本地这一层。与出厂状态怎么合并是宿主的事——卡片不知道自己是从哪份
          // 种子长出来的，也不该替宿主决定哪一边说了算。
          window.parent.postMessage(
            {
              type: STATE_SNAPSHOT_MSG,
              requestId: requestId,
              state: snapshot,
            },
            "*",
          );
        }
        function installCardApi() {
          var base =
            window.card && typeof window.card === "object" ? window.card : null;
          if (!base)
            base =
              window.hana && typeof window.hana === "object"
                ? window.hana
                : null;
          var existing = base || {};
          var stateApi =
            existing.state && typeof existing.state === "object"
              ? existing.state
              : {};
          stateApi.get = function (key) {
            return requestHostCapability(
              "state.get",
              typeof key === "string" && key.trim() ? { key: key.trim() } : {},
            );
          };
          stateApi.set = function (keyOrState, value) {
            if (typeof keyOrState === "string") {
              rememberLocalState(keyOrState, value);
              return requestHostCapability("state.set", {
                key: keyOrState,
                value: value,
              });
            }
            var patch =
              keyOrState && typeof keyOrState === "object" ? keyOrState : {};
            rememberLocalStatePatch(patch);
            return requestHostCapability("state.set", { state: patch });
          };
          existing.request = requestHostCapability;
          existing.invoke = function (bindingId, input) {
            return requestHostCapability("tool.invoke", {
              bindingId: bindingId,
              input: input,
            });
          };

            return requestHostCapability("host.capabilities", {});
          };
          existing.state = stateApi;
          window.card = existing;
          // hana 只是留给已经铸出去的老卡片的兼容别名，指向上面那个同一个对象。
          // 所有面向未来的东西——新写的卡、铸卡教材、文档——一律只用 card。
          window.hana = existing;
        }
        installCardApi();
        // ── 声明式触发层：data-invoke / data-persist / data-result ──

                      : undefined,

    <script>
      (function () {
        var ARROW_SVG =
          '<svg class="oc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
        var statusEl = document.getElementById("oc-status");
        var statusText = document.getElementById("oc-status-text");
        var questionEl = document.getElementById("oc-q");
        var listEl = document.getElementById("oc-list");
        var customInput = document.getElementById("oc-custom-input");
        var skipBtn = document.getElementById("oc-skip-btn");
        var sendBtn = document.getElementById("oc-custom-send");
        var picked = false;
        var cardId = "";
        var options = [];

        // 状态读取：模板内嵌 data-card-state 为默认值（独立打开也可展示）；
        // 宿主铸造时经 show_card(template, state) 注入的状态由 window.card.state.get() 提供，

            'script[type="application/json"][data-card-state]',

              typeof parsed === "object" &&

              : {};
          } catch (_) {

          }

          if (Object.prototype.toString.call(source) !== "[object Array]")

          for (var i = 0; i < source.length; i += 1) {
            var text = typeof source[i] === "string" ? source[i].trim() : "";

          }
          return out;
        }
        function applyState(source) {
          if (!source || typeof source !== "object") return;
          if (typeof source.cardId === "string") cardId = source.cardId;
          if (typeof source.question === "string")
            questionEl.textContent = source.question;
          if (source.options !== undefined)
            options = normalizeOptions(source.options);
        }
        function setStatus(text, cls) {
          statusEl.style.display = "flex";
          statusText.textContent = text;
          statusEl.className = "oc-status" + (cls ? " " + cls : "");
        }
        function lockAll() {
          document.querySelectorAll(".oc-row").forEach(function (b) {
            b.disabled = true;
          });
          skipBtn.disabled = true;
          sendBtn.disabled = true;
          customInput.disabled = true;
        }
        function unlockAll() {
          document.querySelectorAll(".oc-row").forEach(function (b) {
            b.disabled = false;
          });
          skipBtn.disabled = false;
          sendBtn.disabled = false;
          customInput.disabled = false;
        }

        // 反馈策略：正常路径反馈文本顶掉触发按钮（零新增高度）；错误路径显示底部状态条 oc-status.err。
        // 消费闸门（已消费幂等）在 option_choose 侧，此处只按 invoke 返回 ok 判定成功。
        // manifest 三个 binding（opt/skip/custom）的 input 均为空对象，cardId/choice/mode
        // 全部经 slots 运行时传入——这里不再写死任何固定参数。
        function submit(bindingId, value, mode, fbLabel) {
          if (picked) return;
          picked = true;
          lockAll();
          if (fbLabel) {
            fbLabel.textContent = "正在发送…";
            statusEl.style.display = "none";
            if (fbLabel === sendBtn || fbLabel === skipBtn) {
              fbLabel.classList.add("oc-fb");
              (fbLabel === sendBtn ? skipBtn : sendBtn).style.display = "none";
            }
          }
          if (!window.card || typeof window.card.invoke !== "function") {
            if (fbLabel) fbLabel.textContent = "发送失败";

            .then(function () {

                cardId: cardId,
                choice: value,
                mode: mode,

            .then(function (data) {
              if (data && data.ok) {
                if (fbLabel)
                  fbLabel.textContent =
                    mode === "skip" ? "已跳过" : "已发送 · " + value;
              } else {
                if (fbLabel) fbLabel.textContent = "发送失败";
                setStatus(
                  "发送失败：" +
                    ((data && (data.error || data.code)) || "unknown"),
                  "err",
                );
              }
            })
            .catch(function (e) {
              if (fbLabel) fbLabel.textContent = "发送失败";
              setStatus(
                "发送失败：" + (e && e.message ? e.message : String(e)),
                "err",

            });

        function buildRow(text, index) {
          var row = document.createElement("button");
          row.type = "button";
          row.className = "oc-row";
          row.setAttribute("aria-label", "选择 " + text);
          var idx = document.createElement("span");
          idx.className = "oc-idx";
          idx.textContent = String(index + 1).padStart(2, "0");
          var label = document.createElement("span");
          label.className = "oc-label";
          label.textContent = text;
          row.appendChild(idx);
          row.appendChild(label);
          row.insertAdjacentHTML("beforeend", ARROW_SVG);
          row.addEventListener("click", function () {
            if (picked) return;
            row.classList.add("oc-picked");
            submit("opt", text, "option", label);
          });
          return row;
        }
        function render() {
          if (picked) return;
          while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
          for (var i = 0; i < options.length; i += 1)
            listEl.appendChild(buildRow(options[i], i));
          // cardId 为空：模板被独立打开 / 尚未被宿主以真实状态铸造——按钮禁用并提示
          if (!cardId) {
            lockAll();
            setStatus("卡片尚未绑定宿主，无法发送选择", "");
          } else {
            unlockAll();
            statusEl.style.display = "none";
          }
        }
        sendBtn.addEventListener("click", function () {
          if (picked) return;
          var v = customInput.value.trim();
          if (!v) return;
          submit("custom", v, "custom", sendBtn);
        });
        customInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            sendBtn.click();
          }
        });
        skipBtn.addEventListener("click", function () {
          if (picked) return;
          submit("skip", "", "skip", skipBtn);
        });

        applyState(readEmbeddedState());
        render();
        var api = window.card;
        if (api && api.state && typeof api.state.get === "function") {
          api.state.get().then(
            function (envelope) {
              var result =
                envelope && envelope.ok === true ? envelope.result : null;
              var stored = result && result.state ? result.state : null;
              if (stored && typeof stored === "object") applyState(stored);
              render();
            },
            function () {
              render();
            },
          );
        }
      })();

        }

        function replace(node) {
          if (!node || node.__cardPlaceholderDone || !node.parentNode) return;
          node.__cardPlaceholderDone = true;
          installStyle();
          node.parentNode.replaceChild(build(node), node);
        }

        /* <picture> 里某个 <source> 失败不是读者看得见的失败：浏览器换下一个候选，
     全都不行时由里面的 <img> 报出来。媒体元素里没有这个代言人，所以等浏览器
     落定之后看一眼，确实一个可用源都没有才替换。 */
        function considerSourceParent(parent) {
          if (!parent || !parent.tagName) return;
          var tag = parent.tagName.toUpperCase();
          if (tag !== "VIDEO" && tag !== "AUDIO") return;
          window.setTimeout(function () {
            if (parent.networkState === parent.NETWORK_NO_SOURCE)
              replace(parent);
          }, 0);
        }

        window.addEventListener(
          "error",
          function (event) {
            var node = event.target;
            if (!node || node === window || !node.tagName) return;
            var tag = node.tagName.toUpperCase();
            if (tag === "IMG" || tag === "VIDEO" || tag === "AUDIO") {
              replace(node);
              return;
            }
            if (tag === "SOURCE") considerSourceParent(node.parentNode);
          },
          true,
        );
      })();
    </script>
    <script data-hana-host-script="resize-bridge">
      (function () {
        var NS = "hana.card-resize";
        var last = 0;
        function report() {
          var h = document.documentElement.scrollHeight;
          if (h !== last) {
            last = h;
            window.parent.postMessage({ type: NS, height: h }, "*");
          }
        }
        if (document.readyState === "complete") report();
        else window.addEventListener("load", report);
        // 高度自适应是增强，不是运行前提。没有 ResizeObserver 的环境（老浏览器、
        // 精简 webview）里这行会抛 ReferenceError——一张导出的卡片被双击打开时
        // 不该因为一个宿主向的增强就往控制台扔未捕获异常。
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(function () {
            report();
          }).observe(document.body);
        }
        // 响应宿主 ping，覆盖 ResizeObserver 首报被漏掉的竞态
        window.addEventListener("message", function (e) {
          if (e.data === "hana.card-ping") {
            last = 0;
            report();
          }
        });
      })();
    </script>
  </body>
</html>
